<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600" fill="none">
  <defs>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#9CA3AF" stroke-width="0.75" stroke-opacity="0.18"/>
      <circle cx="0" cy="0" r="1.5" fill="#6B7280" fill-opacity="0.25"/>
    </pattern>
  </defs>

  <!-- Base Grid -->
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Schematics: Mechanical Gear 1 -->
  <g transform="translate(100, 120)" stroke="#6B7280" stroke-opacity="0.15" fill="none" stroke-width="1.2">
    <circle cx="0" cy="0" r="45" />
    <circle cx="0" cy="0" r="22" stroke-dasharray="3 3"/>
    <circle cx="0" cy="0" r="10" fill="#9CA3AF" fill-opacity="0.1"/>
    <path d="M -8 -50 H 8 V -42 H -8 Z M -8 42 H 8 V 50 H -8 Z M -50 -8 V 8 H -42 V -8 Z M 42 -8 V 8 H 50 V -8 Z"/>
    <path d="M -35 -35 L -29 -29 M 29 29 L 35 35 M -35 35 L -29 29 M 29 -29 L 35 -35" stroke-width="3"/>
  </g>

  <!-- Schematics: Hex Nut / Bolt -->
  <g transform="translate(480, 140)" stroke="#4B5563" stroke-opacity="0.16" fill="none" stroke-width="1.5">
    <polygon points="0,-32 27.7,-16 27.7,16 0,32 -27.7,16 -27.7,-16" />
    <circle cx="0" cy="0" r="14" fill="#6B7280" fill-opacity="0.08"/>
    <circle cx="0" cy="0" r="18" stroke-dasharray="2 2"/>
  </g>

  <!-- Schematics: Mechanical Gear 2 (Interlocking) -->
  <g transform="translate(520, 460)" stroke="#6B7280" stroke-opacity="0.14" fill="none" stroke-width="1.2">
    <circle cx="0" cy="0" r="55" />
    <circle cx="0" cy="0" r="28" />
    <circle cx="0" cy="0" r="12" fill="#9CA3AF" fill-opacity="0.12"/>
    <path d="M -9 -62 H 9 V -52 H -9 Z M -9 52 H 9 V 62 H -9 Z M -62 -9 V 9 H -52 V -9 Z M 52 -9 V 9 H 62 V -9 Z"/>
  </g>

  <!-- Circuit Traces & PCB Nodes -->
  <g stroke="#6B7280" stroke-opacity="0.18" stroke-width="1.2" fill="none">
    <path d="M 40 320 H 140 L 180 360 H 260 V 420 L 300 460 H 420" />
    <path d="M 220 80 V 160 L 260 200 H 380" stroke-dasharray="4 2"/>
    <path d="M 480 260 V 340 L 440 380 H 340" />
    
    <circle cx="40" cy="320" r="3" fill="#6B7280" fill-opacity="0.25"/>
    <circle cx="140" cy="320" r="2" fill="#6B7280" fill-opacity="0.25"/>
    <circle cx="260" cy="360" r="3" fill="#6B7280" fill-opacity="0.25"/>
    <circle cx="420" cy="460" r="3" fill="#6B7280" fill-opacity="0.25"/>
    <circle cx="220" cy="80" r="3" fill="#6B7280" fill-opacity="0.25"/>
    <circle cx="380" cy="200" r="3" fill="#6B7280" fill-opacity="0.25"/>
    <circle cx="340" cy="380" r="3" fill="#6B7280" fill-opacity="0.25"/>
  </g>

  <!-- Technical Axis Crosshairs -->
  <g stroke="#9CA3AF" stroke-opacity="0.2" stroke-width="1">
    <line x1="280" y1="290" x2="320" y2="290"/>
    <line x1="300" y1="270" x2="300" y2="310"/>
    <circle cx="300" cy="290" r="16" fill="none" stroke-dasharray="2 2"/>
  </g>
</svg>

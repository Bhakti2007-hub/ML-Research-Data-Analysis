<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="100%" height="100%" fill="none">
  <defs>
    <!-- Metallic Gradients -->
    <linearGradient id="metalGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3F4F6"/>
      <stop offset="30%" stop-color="#D1D5DB"/>
      <stop offset="70%" stop-color="#9CA3AF"/>
      <stop offset="100%" stop-color="#4B5563"/>
    </linearGradient>
    <linearGradient id="metalGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9CA3AF"/>
      <stop offset="50%" stop-color="#4B5563"/>
      <stop offset="100%" stop-color="#1F2937"/>
    </linearGradient>
    <linearGradient id="graphiteGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#374151"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5E7EB" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#6B7280" stop-opacity="0.1"/>
    </linearGradient>
    <radialGradient id="sensorGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#9CA3AF"/>
      <stop offset="100%" stop-color="#1F2937"/>
    </radialGradient>
    <filter id="subtleBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- Background Research Elements & Circuit Traces -->
  <g opacity="0.35" stroke="#9CA3AF" stroke-width="1.2" stroke-dasharray="3 3">
    <!-- Grid & Circuit Traces -->
    <path d="M 50 160 H 160 L 190 120 H 260" fill="none"/>
    <path d="M 90 240 H 180 L 210 200 H 310" fill="none"/>
    <path d="M 230 40 V 100 L 200 130" fill="none"/>
    <circle cx="50" cy="160" r="3" fill="#6B7280"/>
    <circle cx="260" cy="120" r="3" fill="#6B7280"/>
    <circle cx="90" cy="240" r="3" fill="#6B7280"/>
    <circle cx="310" cy="200" r="3" fill="#6B7280"/>
    
    <!-- Subtle Engineering Gear Silhouette -->
    <g transform="translate(60, 60) scale(0.6)" opacity="0.4" stroke="#6B7280" stroke-width="1.5">
      <circle cx="0" cy="0" r="28" fill="none"/>
      <circle cx="0" cy="0" r="14" fill="none"/>
      <path d="M-6 -32 H6 V-28 H-6 Z M-6 28 H6 V32 H-6 Z M-32 -6 V6 H-28 V-6 Z M28 -6 V6 H32 V-6 Z"/>
      <path d="M-22 -22 L-18 -18 M18 18 L22 22 M-22 22 L-18 18 M18 -18 L22 -22" stroke-width="4"/>
    </g>
    
    <!-- Mechanical Nut / Bolt Silhouette -->
    <g transform="translate(340, 70) scale(0.5)" opacity="0.4" stroke="#6B7280" stroke-width="2">
      <polygon points="0,-24 20.78,-12 20.78,12 0,24 -20.78,12 -20.78,-12" fill="none"/>
      <circle cx="0" cy="0" r="10" fill="none"/>
    </g>
  </g>

  <!-- AI Model Pod / Research Stand Base -->
  <ellipse cx="230" cy="285" rx="85" ry="16" fill="url(#graphiteGrad)" stroke="#6B7280" stroke-width="1.5"/>
  <ellipse cx="230" cy="280" rx="70" ry="12" fill="url(#metalGrad2)" stroke="#9CA3AF" stroke-width="1"/>
  <ellipse cx="230" cy="275" rx="45" ry="7" fill="url(#metalGrad1)" stroke="#D1D5DB" stroke-width="1"/>

  <!-- Torso & Mechanical Chasis -->
  <path d="M 195 195 L 205 265 H 255 L 265 195 Z" fill="url(#metalGrad2)" stroke="#111827" stroke-width="1.5"/>
  <path d="M 205 200 H 255 L 250 250 H 210 Z" fill="url(#graphiteGrad)" stroke="#4B5563" stroke-width="1"/>
  
  <!-- Chest Core Plate -->
  <polygon points="215,208 245,208 240,238 220,238" fill="url(#metalGrad1)" stroke="#9CA3AF" stroke-width="1.2"/>
  <circle cx="230" cy="223" r="5" fill="url(#sensorGlow)" stroke="#FFFFFF" stroke-width="0.8"/>
  <line x1="210" y1="215" x2="200" y2="215" stroke="#9CA3AF" stroke-width="1.5"/>
  <line x1="250" y1="215" x2="260" y2="215" stroke="#9CA3AF" stroke-width="1.5"/>

  <!-- Neck Hydraulic Actuators -->
  <rect x="220" y="165" width="20" height="32" rx="4" fill="url(#metalGrad2)" stroke="#1F2933" stroke-width="1"/>
  <line x1="225" y1="168" x2="225" y2="192" stroke="#D1D5DB" stroke-width="1.5"/>
  <line x1="235" y1="168" x2="235" y2="192" stroke="#D1D5DB" stroke-width="1.5"/>

  <!-- Shoulder Joints -->
  <circle cx="185" cy="205" r="14" fill="url(#metalGrad1)" stroke="#374151" stroke-width="1.5"/>
  <circle cx="185" cy="205" r="7" fill="url(#graphiteGrad)" stroke="#9CA3AF" stroke-width="1"/>
  
  <circle cx="275" cy="205" r="14" fill="url(#metalGrad1)" stroke="#374151" stroke-width="1.5"/>
  <circle cx="275" cy="205" r="7" fill="url(#graphiteGrad)" stroke="#9CA3AF" stroke-width="1"/>

  <!-- Bicep & Arm Assemblies (Articulated Laboratory Arm) -->
  <path d="M 175 210 L 155 255 L 168 260 L 188 215 Z" fill="url(#metalGrad2)" stroke="#111827" stroke-width="1.2"/>
  <circle cx="158" cy="260" r="9" fill="url(#metalGrad1)" stroke="#4B5563" stroke-width="1.2"/>
  <path d="M 152 265 L 140 300 L 150 305 L 165 268 Z" fill="url(#metalGrad2)" stroke="#111827" stroke-width="1"/>

  <path d="M 285 210 L 305 255 L 292 260 L 272 215 Z" fill="url(#metalGrad2)" stroke="#111827" stroke-width="1.2"/>
  <circle cx="302" cy="260" r="9" fill="url(#metalGrad1)" stroke="#4B5563" stroke-width="1.2"/>
  <path d="M 308 265 L 320 300 L 310 305 L 295 268 Z" fill="url(#metalGrad2)" stroke="#111827" stroke-width="1"/>

  <!-- Head Assembly: Futuristic AI Engineering Cranium -->
  <!-- Outer Helmet / Cranium Plates -->
  <path d="M 195 130 C 195 85, 265 85, 265 130 C 265 155, 255 172, 230 174 C 205 172, 195 155, 195 130 Z" 
        fill="url(#metalGrad1)" stroke="#374151" stroke-width="1.8"/>
  
  <!-- Dark Graphite Visor / Optical Array Housing -->
  <path d="M 202 118 C 202 104, 258 104, 258 118 C 258 138, 250 148, 230 148 C 210 148, 202 138, 202 118 Z" 
        fill="url(#graphiteGrad)" stroke="#111827" stroke-width="1.5"/>

  <!-- Optical Sensor / Neural HUD Line -->
  <ellipse cx="230" cy="125" rx="20" ry="5.5" fill="none" stroke="#D1D5DB" stroke-width="1.5"/>
  <circle cx="230" cy="125" r="4.5" fill="url(#sensorGlow)" stroke="#FFFFFF" stroke-width="1"/>
  <circle cx="218" cy="125" r="2" fill="#9CA3AF"/>
  <circle cx="242" cy="125" r="2" fill="#9CA3AF"/>

  <!-- Forehead Sensor Plate & Engraving -->
  <polygon points="220,92 240,92 236,102 224,102" fill="url(#metalGrad2)" stroke="#6B7280" stroke-width="0.8"/>
  <circle cx="230" cy="97" r="1.8" fill="#FFFFFF"/>

  <!-- Ear / Auditory Sensor Hubs -->
  <rect x="188" y="118" width="8" height="24" rx="3" fill="url(#metalGrad2)" stroke="#1F2933" stroke-width="1.2"/>
  <rect x="264" y="118" width="8" height="24" rx="3" fill="url(#metalGrad2)" stroke="#1F2933" stroke-width="1.2"/>
  <circle cx="192" cy="130" r="2.5" fill="#E5E7EB"/>
  <circle cx="268" cy="130" r="2.5" fill="#E5E7EB"/>

  <!-- Chin & Jaw Articulation Plates -->
  <polygon points="212,156 248,156 242,168 218,168" fill="url(#metalGrad2)" stroke="#374151" stroke-width="1.2"/>
  <line x1="224" y1="162" x2="236" y2="162" stroke="#9CA3AF" stroke-width="1"/>

  <!-- Subtle Floating Hologram / AI Data Nodes near Hand -->
  <g opacity="0.6">
    <polygon points="120,230 135,215 150,230 135,245" fill="url(#glowGrad)" stroke="#9CA3AF" stroke-width="1"/>
    <circle cx="135" cy="230" r="2" fill="#FFFFFF"/>
    <line x1="135" y1="215" x2="135" y2="200" stroke="#9CA3AF" stroke-width="1" stroke-dasharray="2 2"/>
    <text x="100" y="200" fill="#4B5563" font-family="monospace" font-size="7" font-weight="bold">AI_MODEL_01</text>
  </g>
</svg>
